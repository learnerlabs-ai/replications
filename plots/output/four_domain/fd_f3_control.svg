<text x="36.0" y="496.0" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#616660">Both Learner 1.0 conditions were scored on 8 windows of the 64-window control bank after each domain. The LoRA condition was</text>
<text x="36.0" y="511.0" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#616660">scored once before and once after the stream on all 64 windows (1.377 to 1.293 nats), a different sample, so it is not drawn on</text>
<text x="36.0" y="526.0" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#616660">this axis. Of the 64 control windows 59 are Amharic text; none is a window of the Amharic domain. The dashed levels are each</text>
<text x="36.0" y="541.0" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#616660">condition's recorded base reference; the first measurement inside the stream is the one after the first domain. Source:</text>
<text x="36.0" y="556.0" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#616660">A_equivalence.json control_domain.</text>
</svg>
